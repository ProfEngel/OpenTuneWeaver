[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:ollama]
command=/usr/local/bin/ollama serve
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/ollama.err.log
stdout_logfile=/var/log/supervisor/ollama.out.log
environment=OLLAMA_HOST="0.0.0.0:11434",OLLAMA_MODELS="/root/.ollama/models"
priority=1

[program:ollama-pull]
command=/workspace/OpenTuneWeaver/scripts/pull-models.sh
autostart=true
autorestart=false
startsecs=0
startretries=3
stderr_logfile=/var/log/supervisor/ollama-pull.err.log
stdout_logfile=/var/log/supervisor/ollama-pull.out.log
priority=2

[program:opentuneweaver]
command=python /workspace/OpenTuneWeaver/ui/app.py
directory=/workspace/OpenTuneWeaver/ui
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/otw.err.log
stdout_logfile=/var/log/supervisor/otw.out.log
environment=PYTHONPATH="/workspace/OpenTuneWeaver",HF_HOME="/workspace/.cache/huggingface"
priority=3

[group:services]
programs=ollama,opentuneweaver