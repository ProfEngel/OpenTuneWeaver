version: '3.8'

services:
  opentuneweaver:
    build: .
    image: opentuneweaver:latest
    container_name: otw-container
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_TOKEN=${HF_TOKEN}
      - OLLAMA_HOST=http://100.70.50.6:11434
    ports:
      - "8080:8080"
    volumes:
      - ./pipeline/data:/workspace/OpenTuneWeaver/pipeline/data
      - ./pipeline/modules:/workspace/OpenTuneWeaver/pipeline/modules
      - ~/.cache/huggingface:/workspace/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped